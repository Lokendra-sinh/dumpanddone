name: deploy to development
on:
  push:
    branches: [dev]
    paths:
      - 'apps/server/**'
      - 'packages/types/**'
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:  # Fixed indentation here
      - name: checkout the code
        uses: actions/checkout@v2

      - name: login to github container registry
        uses: docker/login-action@v2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}  # Changed to newer syntax

      - name: Set up docker buildx
        uses: docker/setup-buildx-action@v2

      - name: Build and push docker image
        uses: docker/build-push-action@v4
        with: 
          context: .
          file: Dockerfile.prod
          push: true
          tags: ghcr.io/${{ github.repository }}:${{ github.sha }}  # Added missing tags

      - name: setup ssh 
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H ${{ secrets.HOSTINGER_IP }} >> ~/.ssh/known_hosts

      - name: Deploy to remote server
        run: |
          ssh root@${{ secrets.HOSTINGER_IP }} "
            # Create required directories
            mkdir -p /root/apps/dumpanddone

            # Create env file
            cat > /root/apps/dumpanddone/.env << EOL
            PORT=${{ secrets.PORT }}
            ANTHROPIC_API_KEY=${{ secrets.ANTHROPIC_API_KEY }}
            DEEPSEEK_API_KEY=${{ secrets.DEEPSEEK_API_KEY }}
            OPENAI_API_KEY=${{ secrets.OPENAI_API_KEY }}
            R2_ACCESS_KEY_ID=${{ secrets.R2_ACCESS_KEY_ID }}
            R2_SECRET_ACCESS_KEY=${{ secrets.R2_SECRET_ACCESS_KEY }}
            DATABASE_URL=postgresql://${{ secrets.POSTGRES_USER }}:${{ secrets.POSTGRES_PASSWORD }}@db:5432/${{ secrets.POSTGRES_DB }}
            GOOGLE_CLIENT_ID=${{ secrets.GOOGLE_CLIENT_ID }}
            JWT_SECRET=${{ secrets.JWT_SECRET }}
            CLIENT_ID_GITHUB=${{ secrets.CLIENT_ID_GITHUB }}
            CLIENT_SECRET_GITHUB=${{ secrets.CLIENT_SECRET_GITHUB }}
            CLOUDFLARE_ACCOUNT_ID=${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
            R2_BUCKET_NAME=${{ secrets.R2_BUCKET_NAME }}
            POSTGRES_USER=${{ secrets.POSTGRES_USER }}
            POSTGRES_PASSWORD=${{ secrets.POSTGRES_PASSWORD }}
            POSTGRES_DB=${{ secrets.POSTGRES_DB }}
            EOL

            # Create docker-compose file
            cat > /root/apps/dumpanddone/docker-compose.prod.yaml << EOL
            services:
              server:
                image: ghcr.io/${{ github.repository }}:${{ github.sha }}
                restart: unless-stopped
                environment:
                  - DATABASE_URL=postgresql://${{ secrets.POSTGRES_USER }}:${{ secrets.POSTGRES_PASSWORD }}@db:5432/${{ secrets.POSTGRES_DB }}
                depends_on:
                  db:
                    condition: service_healthy
                ports:
                  - '4000:4000'

              db:
                image: postgres:15
                restart: unless-stopped
                volumes: 
                  - postgres_data:/var/lib/postgresql/data
                environment:
                  - POSTGRES_USER=${{ secrets.POSTGRES_USER }}
                  - POSTGRES_PASSWORD=${{ secrets.POSTGRES_PASSWORD }}
                  - POSTGRES_DB=${{ secrets.POSTGRES_DB }}
                healthcheck:
                  test: ['CMD-SHELL', 'pg_isready -U ${{ secrets.POSTGRES_USER }} -d ${{ secrets.POSTGRES_DB }}']
                  interval: 30s
                  timeout: 30s
                  retries: 5
                  start_period: 30s

            volumes:
              postgres_data:
            EOL

            # Login to GitHub Container Registry
            docker login ghcr.io -u ${{ github.actor }} -p ${{ github.token }}

            # Deploy using docker-compose
            cd /root/apps/dumpanddone
            docker compose -f docker-compose.prod.yaml pull
            docker compose -f docker-compose.prod.yaml up -d
          "