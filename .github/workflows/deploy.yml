name: Deploy to Development

env:
  ACTIONS_STEP_DEBUG: true

on:
  push:
    branches: [dev]

permissions:
  contents: read
  packages: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Debug trigger
        run: |
          echo "🔍 Event that triggered workflow: ${{ github.event_name }}"
          echo "📁 Branch name: ${{ github.ref }}"
          echo "👤 Actor: ${{ github.actor }}"
          echo "📝 Commit message: ${{ github.event.head_commit.message }}"

      - name: Checkout code
        uses: actions/checkout@v4

      - name: List repository contents
        run: |
          echo "📂 Repository contents:"
          ls -la
          echo "🌲 Directory structure:"
          tree -L 3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Set lowercase names
        id: names
        run: |
          echo "owner=$(echo ${{ github.repository_owner }} | tr '[:upper:]' '[:lower:]')" >> $GITHUB_OUTPUT
          echo "repo=$(echo ${{ github.event.repository.name }} | tr '[:upper:]' '[:lower:]')" >> $GITHUB_OUTPUT

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile.prod
          push: true
          tags: ghcr.io/${{ steps.names.outputs.owner }}/${{ steps.names.outputs.repo }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H ${{ secrets.HOSTINGER_IP }} 2>/dev/null >> ~/.ssh/known_hosts
          echo "🔑 SSH key fingerprint:"
          ssh-keygen -lf ~/.ssh/known_hosts

      - name: Test SSH connection
        run: |
          echo "🔍 Testing SSH connection..."
          ssh -o StrictHostKeyChecking=no -T root@${{ secrets.HOSTINGER_IP }} "echo '✅ SSH connection successful!'"

      - name: Deploy to remote server
        run: |
          echo "🚀 Starting deployment to remote server..."
          ssh -v root@${{ secrets.HOSTINGER_IP }} "
            set -x

            # Update system and ensure Docker is installed
            apt-get update
            apt-get install -y docker.io docker-compose-plugin

            # Create application directory
            mkdir -p /root/apps/dumpanddone

            # Create environment file
            cat <<EOF > /root/apps/dumpanddone/.env
            PORT=${{ secrets.PORT }}
            ANTHROPIC_API_KEY=${{ secrets.ANTHROPIC_API_KEY }}
            DEEPSEEK_API_KEY=${{ secrets.DEEPSEEK_API_KEY }}
            OPENAI_API_KEY=${{ secrets.OPENAI_API_KEY }}
            R2_ACCESS_KEY_ID=${{ secrets.R2_ACCESS_KEY_ID }}
            R2_SECRET_ACCESS_KEY=${{ secrets.R2_SECRET_ACCESS_KEY }}
            DATABASE_URL=postgresql://${{ secrets.POSTGRES_USER }}:${{ secrets.POSTGRES_PASSWORD }}@db:5432/${{ secrets.POSTGRES_DB }}
            GOOGLE_CLIENT_ID=${{ secrets.GOOGLE_CLIENT_ID }}
            JWT_SECRET=${{ secrets.JWT_SECRET }}
            CLIENT_ID_GITHUB=${{ secrets.CLIENT_ID_GITHUB }}
            CLIENT_SECRET_GITHUB=${{ secrets.CLIENT_SECRET_GITHUB }}
            CLOUDFLARE_ACCOUNT_ID=${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
            R2_BUCKET_NAME=${{ secrets.R2_BUCKET_NAME }}
            POSTGRES_USER=${{ secrets.POSTGRES_USER }}
            POSTGRES_PASSWORD=${{ secrets.POSTGRES_PASSWORD }}
            POSTGRES_DB=${{ secrets.POSTGRES_DB }}
            EOF

            # Create docker-compose file
            cat <<EOF > /root/apps/dumpanddone/docker-compose.prod.yaml
            services:
              server:
                image: ghcr.io/${{ steps.names.outputs.owner }}/${{ steps.names.outputs.repo }}:${{ github.sha }}
                restart: unless-stopped
                env_file: .env
                depends_on:
                  db:
                    condition: service_healthy
                ports:
                  - '4000:4000'

              db:
                image: postgres:15
                restart: unless-stopped
                env_file: .env
                volumes:
                  - postgres_data:/var/lib/postgresql/data
                healthcheck:
                  test: ['CMD-SHELL', 'pg_isready -U ${{ secrets.POSTGRES_USER }} -d ${{ secrets.POSTGRES_DB }}']
                  interval: 30s
                  timeout: 30s
                  retries: 5
                  start_period: 30s

            volumes:
              postgres_data:
            EOF

            # Login to GitHub Container Registry
            echo '${{ github.token }}' | docker login ghcr.io -u ${{ github.actor }} --password-stdin

            # Deploy using docker-compose
            cd /root/apps/dumpanddone
            docker compose -f docker-compose.prod.yaml pull
            docker compose -f docker-compose.prod.yaml up -d

            # Show deployment status
            docker compose -f docker-compose.prod.yaml ps
            docker compose -f docker-compose.prod.yaml logs --tail=100
          "

      - name: Verify deployment
        if: always()
        run: |
          echo "🔍 Verifying deployment..."
          ssh root@${{ secrets.HOSTINGER_IP }} "
            cd /root/apps/dumpanddone
            echo '📊 Container status:'
            docker compose -f docker-compose.prod.yaml ps
            echo '📜 Recent logs:'
            docker compose -f docker-compose.prod.yaml logs --tail=50
          "