name: deploy to development
env:
  ACTIONS_STEP_DEBUG: true  # Enable detailed GitHub Actions logging

on:
  push:
    branches: [dev]
    # Removed paths restriction so workflow runs on every push to dev

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Debug trigger
        run: |
          echo "🔍 Event that triggered workflow: ${{ github.event_name }}"
          echo "📁 Branch name: ${{ github.ref }}"
          echo "👤 Actor: ${{ github.actor }}"
          echo "📝 Commit message: ${{ github.event.head_commit.message }}"

      - name: checkout the code
        id: checkout
        uses: actions/checkout@v2
        
      - name: List repository contents
        run: |
          echo "📂 Repository contents:"
          ls -la
          echo "🌲 Directory structure:"
          tree -L 3

      - name: login to github container registry
        id: login
        uses: docker/login-action@v2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Set up docker buildx
        id: buildx
        uses: docker/setup-buildx-action@v2

      - name: Set lowercase names
        id: names
        run: |
          echo "owner=$(echo ${{ github.repository_owner }} | tr '[:upper:]' '[:lower:]')" >> $GITHUB_OUTPUT
          echo "repo=${{ github.event.repository.name }}" >> $GITHUB_OUTPUT
      
      - name: Build and push docker image
        uses: docker/build-push-action@v4
        with: 
          context: .
          file: Dockerfile.prod
          push: true
          tags: ghcr.io/${{ steps.names.outputs.owner }}/${{ steps.names.outputs.repo }}:${{ github.sha }}

      - name: setup ssh 
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          # Add -H flag and redirect stderr to /dev/null to avoid warnings
          ssh-keyscan -H ${{ secrets.HOSTINGER_IP }} 2>/dev/null >> ~/.ssh/known_hosts
          # Verify the key was added
          echo "🔑 SSH key fingerprint:"
          ssh-keygen -lf ~/.ssh/known_hosts
      
      - name: Test SSH connection
        run: |
          echo "🔍 Testing SSH connection..."
          ssh -o StrictHostKeyChecking=no -T root@${{ secrets.HOSTINGER_IP }} "echo '✅ SSH connection successful!'"

      - name: Deploy to remote server
        id: deploy
        run: |
          echo "🚀 Starting deployment to remote server..."
          ssh -v root@${{ secrets.HOSTINGER_IP }} "
            set -x  # Print commands before execution
            
            echo '📁 Creating directories...'
            mkdir -p /root/apps/dumpanddone
            
            echo '🔑 Creating env file...'
            cat > /root/apps/dumpanddone/.env << EOL
            PORT=${{ secrets.PORT }}
            ANTHROPIC_API_KEY=${{ secrets.ANTHROPIC_API_KEY }}
            DEEPSEEK_API_KEY=${{ secrets.DEEPSEEK_API_KEY }}
            OPENAI_API_KEY=${{ secrets.OPENAI_API_KEY }}
            R2_ACCESS_KEY_ID=${{ secrets.R2_ACCESS_KEY_ID }}
            R2_SECRET_ACCESS_KEY=${{ secrets.R2_SECRET_ACCESS_KEY }}
            DATABASE_URL=postgresql://${{ secrets.POSTGRES_USER }}:${{ secrets.POSTGRES_PASSWORD }}@db:5432/${{ secrets.POSTGRES_DB }}
            GOOGLE_CLIENT_ID=${{ secrets.GOOGLE_CLIENT_ID }}
            JWT_SECRET=${{ secrets.JWT_SECRET }}
            CLIENT_ID_GITHUB=${{ secrets.CLIENT_ID_GITHUB }}
            CLIENT_SECRET_GITHUB=${{ secrets.CLIENT_SECRET_GITHUB }}
            CLOUDFLARE_ACCOUNT_ID=${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
            R2_BUCKET_NAME=${{ secrets.R2_BUCKET_NAME }}
            POSTGRES_USER=${{ secrets.POSTGRES_USER }}
            POSTGRES_PASSWORD=${{ secrets.POSTGRES_PASSWORD }}
            POSTGRES_DB=${{ secrets.POSTGRES_DB }}
            EOL
            echo '✅ Env file created'
            
            echo '📝 Creating docker-compose file...'
            cat > /root/apps/dumpanddone/docker-compose.prod.yaml << EOL
            services:
              server:
                image: ghcr.io/${{ github.repository }}:${{ github.sha }}
                restart: unless-stopped
                environment:
                  - DATABASE_URL=postgresql://${{ secrets.POSTGRES_USER }}:${{ secrets.POSTGRES_PASSWORD }}@db:5432/${{ secrets.POSTGRES_DB }}
                depends_on:
                  db:
                    condition: service_healthy
                ports:
                  - '4000:4000'

              db:
                image: postgres:15
                restart: unless-stopped
                volumes: 
                  - postgres_data:/var/lib/postgresql/data
                environment:
                  - POSTGRES_USER=${{ secrets.POSTGRES_USER }}
                  - POSTGRES_PASSWORD=${{ secrets.POSTGRES_PASSWORD }}
                  - POSTGRES_DB=${{ secrets.POSTGRES_DB }}
                healthcheck:
                  test: ['CMD-SHELL', 'pg_isready -U ${{ secrets.POSTGRES_USER }} -d ${{ secrets.POSTGRES_DB }}']
                  interval: 30s
                  timeout: 30s
                  retries: 5
                  start_period: 30s

            volumes:
              postgres_data:
            EOL
            echo '✅ Docker-compose file created'
            
            echo '🔐 Logging into GitHub Container Registry...'
            docker login ghcr.io -u ${{ github.actor }} -p ${{ github.token }}
            
            echo '📦 Pulling latest images...'
            cd /root/apps/dumpanddone
            docker compose -f docker-compose.prod.yaml pull
            
            echo '🚀 Starting containers...'
            docker compose -f docker-compose.prod.yaml up -d
            
            echo '🔍 Checking container status...'
            docker compose -f docker-compose.prod.yaml ps
            
            echo '📜 Showing container logs...'
            docker compose -f docker-compose.prod.yaml logs --tail=100
            
            echo '✅ Deployment complete!'
          "

      - name: Verify deployment
        if: always()  # Run even if previous step fails
        run: |
          echo "🔍 Verifying deployment..."
          ssh root@${{ secrets.HOSTINGER_IP }} "
            cd /root/apps/dumpanddone
            echo '📊 Container status:'
            docker compose -f docker-compose.prod.yaml ps
            echo '📜 Recent logs:'
            docker compose -f docker-compose.prod.yaml logs --tail=50
          "